[uwsgi]
ini = /etc/uwsgi/base.ini

; Serves the Home Assistant ingress prefix. hc/local_settings.py turns
; HC_FORCE_SCRIPT_NAME into Django's FORCE_SCRIPT_NAME.
http-socket = 127.0.0.1:8001

processes = 1
threads = 4

; The background workers live here and nowhere else. Running them in both
; instances would send every alert and every report twice.
attach-daemon = /opt/venv/bin/python manage.py sendalerts --skip-checks
attach-daemon = /opt/venv/bin/python manage.py sendreports --loop --skip-checks

if-env = SMTPD_PORT
attach-daemon = /opt/venv/bin/python manage.py smtpd --port %(_) --skip-checks
endif =
