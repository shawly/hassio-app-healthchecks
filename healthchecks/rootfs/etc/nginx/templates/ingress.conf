server {
    listen 1337 default_server;

    include /etc/nginx/includes/server_params.conf;

    # Home Assistant redirects to the ingress entry without a trailing slash.
    location = %%ingress_entry%% {
        return 301 %%ingress_entry%%/;
    }

    location ^~ %%ingress_entry%%/static/ {
        allow   172.30.32.2;
        allow   127.0.0.1;
        deny    all;

        include /etc/nginx/includes/static.conf;
    }

    location %%ingress_entry%%/ {
        allow   172.30.32.2;
        allow   127.0.0.1;
        deny    all;

        # proxy_set_header is an array directive: defining one at this level
        # drops every one inherited from the server block, so the shared
        # parameters have to be included here rather than above.
        include /etc/nginx/includes/proxy_params.conf;

        # Auto-login header, filled in by init-nginx when ingress_user is set.
        proxy_set_header X-Authenticated-User %%ingress_user%%;

        # The trailing slash strips the ingress prefix off the request. Django
        # puts it back on generated URLs from FORCE_SCRIPT_NAME.
        proxy_pass http://ingress_backend/;
    }

    location / {
        return 404;
    }
}
