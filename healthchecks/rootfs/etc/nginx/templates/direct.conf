server {
    listen 8000 default_server;

    include /etc/nginx/includes/server_params.conf;

    location /static/ {
        include /etc/nginx/includes/static.conf;
    }

    location / {
        include /etc/nginx/includes/proxy_params.conf;

        # Never let the ingress auto-login header through on the public port.
        proxy_set_header X-Authenticated-User "";

        proxy_pass http://direct_backend;
    }
}
